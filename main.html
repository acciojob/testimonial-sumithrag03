<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
	 <title>Testimonial Section</title>
    <style>
        body {
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .main-container {
            padding: 20px;
            background-color: #f5f5f5;
        }

        .testimonial {
            padding: 15px;
            border: 1px solid #cccccc;
            background-color: white;
            margin-bottom: 15px;
        }

        .text {
            font-size: 16px;
            color: #333333;
        }

        .author {
            text-align: right;
            font-style: italic;
        }
    </style>
</head>

<body>
	<!-- the entire body must be written by student -->
    <script type="text/javascript" src="./script.js">
</script>
	<div class="main-container">
        <div class="testimonial">
            <p class="text">This is an amazing service! I am very happy with the experience.</p>
            <p class="author">- John Doe</p>
        </div>

        <div class="testimonial">
            <p class="text">The team was professional and delivered excellent results.</p>
            <p class="author">- Jane Smith</p>
        </div>

        <div class="testimonial">
            <p class="text">I highly recommend this to anyone looking for quality and reliability.</p>
            <p class="author">- Alex Johnson</p>
        </div>
    </div>

</body>

</html>
